[project]
name = "okama-macro"
version = "0.1.1"
description = "Macro-economic data-source clients (CPI, central-bank rates) for the okama project"
authors = [{ name = "mbk-dev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas",
    "requests",
    "lxml",
    "urllib3",
]

[project.urls]
Homepage = "https://github.com/mbk-dev/okama-macro"
Repository = "https://github.com/mbk-dev/okama-macro"
Documentation = "https://mbk-dev.github.io/okama-macro/"
Issues = "https://github.com/mbk-dev/okama-macro/issues"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
twine = "*"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocstrings-python = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"okama_macro/sources/nbsc/*.py" = ["E501", "C901"]
"okama_macro/sources/cfets/*.py" = ["E711"]
"okama_macro/sources/ecb/*.py" = ["B008", "E501", "E711"]
"okama_macro/sources/boe/*.py" = ["B008", "E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
