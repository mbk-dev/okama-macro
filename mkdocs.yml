site_name: okama-macro
site_description: Normalized CPI inflation and central-bank rate series for Python.
site_url: https://mbk-dev.github.io/okama-macro/
repo_url: https://github.com/mbk-dev/okama-macro
repo_name: mbk-dev/okama-macro
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_root_full_path: false

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - API reference: api.md
  - Data audits:
      - China CPI: audits/nbsc-cny-infl.md
      - China Loan Prime Rates: audits/cfets-chn-lpr.md
      - ECB key rates: audits/ecb-eu-rates.md
      - Israel CPI and policy rate: audits/boi-ils-isr.md
      - UK CPIH: audits/ons-gbp-infl.md
      - UK Bank Rate: audits/boe-uk-br.md

validation:
  nav:
    omitted_files: warn
    absolute_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mbk-dev/okama-macro
      name: okama-macro on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/okama-macro/
      name: okama-macro on PyPI

copyright: Copyright &copy; 2026 Sergey Kikevich
